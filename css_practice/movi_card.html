<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cards-container{
            display: flex;
        
            background-color: aliceblue;
        }
        .movi-card{
            width: 300px;
            height: 600px;
            border: 1px solid;
            background-color:#e5e7eb;
            overflow: hidden;
            border-radius: 16px;
        }
        .movi-image{
            width: auto;
            height: 500px;
            object-fit: cover;
            vertical-align: middle;
        }
            
        .movi-title{
            padding-top: 0px;
            font-weight: 600px;

        }
        .movi-info{
            height: 64px;

            padding: 5px;
        }
        .movi-detail{
            color: black;

        }
    </style>
</head>
<body>
    <div class="cards-container">
        <div class="movi-card">
            <div class="movi-image">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTfYOGKkWgznxHFvW3E8eNUL8NDeO15WojyOg0g4VXkNw&s=10" alt="movi-image">
                

            </div>
            <div class="movi-info">
                <h2 class="movi-title">movi:avengers</h2>
                <span class="movi-detail">A|hindi</span>
            </div>
        </div>
    </div>
    
</body>
</html>
