<head>
    <meta charset="UTF-8">

    <title>Movie Cards</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: sans-serif;
            background-color: white;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(3, 300px);
            gap: 30px;
            padding: 30px;
            background-color: aliceblue;
        }

        .movi-card {
            width: 300px;
            border: 1px solid #ccc;
            background-color: #e5e7eb;
            overflow: hidden;
            border-radius: 16px;
            transition: 0.2s;
        }
        .movi-card:hover{
            transform: scale(1);
            transform: scaleY(1.011);

        }

        .movi-image {
            width: 100%;
            height: 450px;
        }

        .movi-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .movi-info {
            height: 100px;
            padding: 10px;
        }

        .movi-title {
            margin: 0 0 8px;
            font-weight: 600;
        }

        .movi-detail {
            color: black;
        }
    </style>
</head>
